indent-width = 4
line-length = 110
required-version = ">=0.9.4"
target-version = "py312"
preview = true

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
]

[format]
docstring-code-format = true
docstring-code-line-length = 80
line-ending = "lf"
quote-style = "single"

[lint]
ignore = [
    "E265",
    "F811",
    "D100",
    "D105",
    "D104",
    "D203",
    "D211",
    "D213",
    "N818",
    "W505",
    "ANN401",
    "COM812",
]

select = [
    "E3",
    "E5",
    "E4",
    "E7",
    "E9",
    "W",
    "C90",
    "I",
    "N",
    "D",
    "F",
    "ANN",
    "ASYNC",
    "A",
    "COM",
    "RET",
]

[lint.extend-per-file-ignores]
"__init__.py" = ["E402", "E401"]

[lint.flake8-annotations]
allow-star-arg-any = true

[lint.flake8-quotes]
inline-quotes = "single"

[lint.isort]
case-sensitive = true
known-local-folder = ["src"]

[lint.mccabe]
max-complexity = 10

[lint.pycodestyle]
max-doc-length = 100
max-line-length = 110

[lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "D107"]
